aid: cantina-ai
name: Cantina AI
description: >-
  Cantina is a social AI platform founded by Sean Parker (Cantina Labs, San
  Francisco) that lets people create AI-powered social characters that talk,
  perform, and interact, then turn them into short videos to share and go viral.
  The consumer product (cantina.com) centers on building characters with
  personality, chatting with friends and AI, and generating video in seconds
  across a public directory of trending bots and creators. Backed by a16z,
  Benchmark, Greycroft, and Salesforce Ventures. Cantina is a consumer social
  application and does not currently publish a public developer program, API,
  SDK, or documentation surface; this profile captures its real public identity
  and link properties while no external API is available to enrich.
